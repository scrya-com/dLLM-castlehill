# VFM v2 smoke run — Qwen3.6-27B + frozen LLM + trainable adapter.
# Single-GPU, single-process (no dual_gpu, no torchrun).
#
# Launch on MSI (5090 only — PCI bus index 1 becomes cuda:0):
#   cd ~/Documents/GitHub/Open-dLLM
#   CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=1 \
#       PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/python train_vfm_v2.py \
#       vfm_v2_27b_smoke-no-dual-nproc.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: true   # smoke: only the adapter is trainable
  dual_gpu: false

vfm:
  adapter_layers: 2
  adapter_heads: 8
  adapter_dropout: 0.1
  adapter_intermediate_size: 10240   # 2x hidden instead of 4x
  max_completion_len: 512
  tau: 1.0
  sigma: 1.0
  kl_weight_final: 0.01
  kl_weight_warmup_steps: 200
  ar_shift: true

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v2_27b_smoke
  lr: 1e-4
  weight_decay: 0.01
  max_steps: 2000
  micro_batch_size: 1
  global_batch_size: 1
  grad_accum_steps: 1
  log_every: 10
  save_every: 500
  eval_every: 0
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v2-27b-smoke-frozen-llm
