# VFM v2 joint training — Qwen3.6-27B, MSI box dual-GPU.
# Option B: VFM noise adapter + LoRA trained together.
# LoRA warm-started from v11 Repr-Align checkpoint (wandb 9mku5yoy, step 15500).
#
# RTX 5090 (32 GB, cuda:0) + RTX PRO 4000 (24 GB, cuda:1).
# Single-process model-parallel — do NOT use torchrun.
# VISIBLE_DEVICES=1,0 maps 5090 (PCI bus 1) → cuda:0 (adapter device)
#                           4000 (PCI bus 0) → cuda:1 (frozen base layers).
#
# Launch:
#   cd ~/Documents/GitHub/Open-dLLM
#   CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=1,0 \
#       PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       nohup .venv/bin/python train_vfm_v2.py vfm_v2_27b_msi-dual-joint.yaml \
#       > /tmp/vfm_v2_joint.log 2>&1 &

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: false          # LoRA is trainable alongside the adapter
  lora_resume_path: /home/johndpope/ds_offload/checkpoints/d3llm_27b_v11/checkpoints/global_step_15500
  dual_gpu: true
  gpu1_mem: "13GiB"   # RTX PRO 4000 (24 GB) — embedding + most frozen layers; 13→~19GB actual leaving ~4GB for LoRA+activations
  gpu0_mem: "16GiB"   # RTX 5090 (32 GB) — overflow layers + lm_head + LoRA + adapter + optimizer states

vfm:
  adapter_layers: 2
  adapter_heads: 8
  adapter_dropout: 0.1
  adapter_intermediate_size: 10240   # 2x hidden (5120)
  max_completion_len: 512
  tau: 1.0
  sigma: 1.0
  kl_weight_final: 0.01
  kl_weight_warmup_steps: 200
  ar_shift: true
  variational: true

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v2_27b_joint
  lr: 5e-5           # lower than frozen-LLM run; LoRA was warm-started, don't thrash it
  weight_decay: 0.01
  max_steps: 2000
  micro_batch_size: 1
  global_batch_size: 1
  grad_accum_steps: 1
  log_every: 10
  save_every: 500
  eval_every: 0
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v2-27b-joint-v11-warmstart
