# VFM (Variational Flow Map) on Qwen3-1.7B — 50-example comparison
# Frozen bidirectional LLM + trainable noise adapter.
# Uses train_vfm.py (separate training script).

model:
  model_path: Qwen/Qwen3-1.7B
  attn_implementation: sdpa
  vfm:
    adapter_layers: 2
    adapter_heads: 8
    tau: 1.0
    sigma: 1.0
    alpha: 0.5
    freeze_base: true
    max_seq_len: 512

data:
  train_path: /home/johndpope/ds_offload/data_50.jsonl
  train_size: 50
  dataloader_type: native
  data_type: plaintext
  max_seq_len: 512
  text_keys: text
  drop_last: true
  datasets_type: mapping
  num_workers: 2
  prefetch_factor: 2

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm-1.7b-50
  ulysses_parallel_size: 1
  global_batch_size: 4
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: false
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 50

  optimizer: adamw
  lr: 1.0e-4
  lr_warmup_ratio: 0.01
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  lr_min: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_train_epochs: 10

  enable_mixed_precision: true
  enable_gradient_checkpointing: false
  enable_full_shard: false
  enable_fsdp_offload: false
  enable_activation_offload: false
  init_device: cuda
  enable_full_determinism: false
  empty_cache_steps: 50

  data_parallel_mode: ddp

  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 25000
  save_epochs: 0
  save_hf_weights: true
  auto_resume: false
  save_time_interval_minutes: 0

  use_wandb: true
  wandb_project: open-dllm-compare
  wandb_name: 1.7b-50x-vfm
