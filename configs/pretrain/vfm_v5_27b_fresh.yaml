# VFM v5 — Spherical Clifford adapter, CLEAN SLATE (no LoRA warm-start)
#
# v5_27b.yaml failure: fresh adapter + v2 LoRA warm-start = mismatch.
# v2 LoRA was calibrated for off-sphere mu (norm 3-6). v5 outputs mu at 0.859.
# The LoRA amplified the adapter's "((" direction → repetition loop by step 200.
#
# This config: both LoRA and adapter start fresh. Clean convergence, ~12k steps.
#
# Launch:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/python tasks/train_vfm_v2.py \
#       configs/pretrain/vfm_v5_27b_fresh.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: false
  lora_resume_path: null            # fresh LoRA — no v2 bias
  adapter_resume_path: null         # fresh spherical adapter
  dual_gpu: true
  gpu1_mem: "13GiB"
  gpu0_mem: "16GiB"

vfm:
  version: "5"
  variational: false
  refinement_training: false
  adapter_layers: 2
  adapter_heads: 8
  adapter_dropout: 0.1
  adapter_intermediate_size: 10240
  max_completion_len: 512
  tau: 1.0
  sigma: 1.0
  kl_weight_final: 0.0
  kl_weight_warmup_steps: 0
  ar_shift: true
  num_seq_shifts: 16
  num_channel_shifts: 0
  anchor_wt: 0.1
  anchor_entropy_threshold: 2.0

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v5_27b_fresh
  lr: 1e-4
  warmup_steps: 100
  weight_decay: 0.01
  max_steps: 12000
  micro_batch_size: 1
  global_batch_size: 1
  use_8bit_adam: true
  log_every: 10
  save_every: 500
  recon_every: 100
  recon_num_probes: 2
  recon_steps: 8
  recon_threshold: 0.5
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v5-27b-fresh
