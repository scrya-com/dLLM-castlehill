# VFM v4a — continue from step 500 → 12000
#
# Resumes v4a Clifford adapter from step 500 checkpoint.
# Runs 11500 more steps to reach 12000 total (matching VFMv2 baseline).
#
# Launch:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/python tasks/train_vfm_v2.py \
#       configs/pretrain/vfm_v4a_27b_cont.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: false
  lora_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v4a_27b/checkpoints/lora_step_500
  adapter_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v4a_27b/checkpoints/adapter_step_500.pt
  dual_gpu: true
  gpu1_mem: "13GiB"
  gpu0_mem: "16GiB"

vfm:
  version: "4a"
  variational: false
  refinement_training: true
  adapter_layers: 2
  adapter_heads: 8
  adapter_dropout: 0.1
  adapter_intermediate_size: 10240
  max_completion_len: 512
  tau: 1.0
  sigma: 1.0
  kl_weight_final: 0.0
  kl_weight_warmup_steps: 0
  mu_reg_lambda: 0.01
  ar_shift: true
  num_seq_shifts: 16
  num_channel_shifts: 0

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v4a_27b
  start_step: 500
  lr: 1e-4
  warmup_steps: 0
  weight_decay: 0.01
  max_steps: 12000
  micro_batch_size: 1
  global_batch_size: 1
  use_8bit_adam: true
  log_every: 10
  save_every: 500
  recon_every: 500
  recon_num_probes: 2
  recon_steps: 8
  recon_threshold: 0.5
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v4a-27b-cont
