# VFM v2b — clean continuation from v2 step 12000
#
# Same VFMv2 architecture (model.py untouched). Changes vs dual_refine:
#   - refinement_training: false — all positions always see z (no commit_ratio noise)
#   - clean output_dir (vfm_v2b_27b) — doesn't touch vfm_v2_27b_dual_refine
#   - mu_reg_lambda: 0.001 — gentle norm anchor (already in model.py)
#
# Why refinement_training=false: commit_ratio=Uniform(0,1) caused LoRA drift
# in v2 steps 8000-12000 (DIFF regressed). With false, every training step
# is identical to inference — no distribution mismatch.
#
# Launch:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/python tasks/train_vfm_v2.py \
#       configs/pretrain/vfm_v2b_27b.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: false
  lora_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v2_27b_dual_refine/checkpoints/lora_step_12000
  adapter_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v2_27b_dual_refine/checkpoints/adapter_step_12000.pt
  dual_gpu: true
  gpu1_mem: "13GiB"
  gpu0_mem: "16GiB"

vfm:
  variational: false
  refinement_training: false      # all positions see z — matches inference exactly
  adapter_layers: 2
  adapter_heads: 8
  adapter_dropout: 0.1
  adapter_intermediate_size: 10240
  max_completion_len: 512
  tau: 1.0
  sigma: 1.0
  kl_weight_final: 0.0
  kl_weight_warmup_steps: 0
  mu_reg_lambda: 0.001
  ar_shift: true

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v2b_27b
  lr: 5e-5                        # warm-started — conservative LR
  warmup_steps: 20
  weight_decay: 0.01
  max_steps: 2000
  micro_batch_size: 1
  global_batch_size: 1
  use_8bit_adam: true
  log_every: 10
  save_every: 500
  recon_every: 100
  recon_num_probes: 2
  recon_steps: 8
  recon_threshold: 0.7
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v2b-27b
