# LDLM on Qwen3-1.7B — 50-example comparison
# Perceiver encoder/decoder + DiT head on frozen AR encoder
# Latent-space diffusion — seq_len=64 after encoder compression

model:
  model_path: Qwen/Qwen3-1.7B
  attn_implementation: sdpa
  ldlm:
    enabled: true
    encoder_model_name: Qwen/Qwen3-1.7B
    seq_len: 64
    depth: 4
    decoder_noise_std: 3.0
    encoder_hidden_layer: -3
    decoder_num_layers: 2
    diffusion_head_depth: 4
    warmup_steps: 500
    warmup_gamma_min: 0.001
    tangent_d: 3.0
    self_condition_prob: 0.5
    log_interval: 50
    gen_eval_interval: 500
    log_latent_histograms: false
    log_samples: false

data:
  train_path: /home/johndpope/ds_offload/data_50.jsonl
  train_size: 50
  dataloader_type: native
  data_type: plaintext
  max_seq_len: 64
  text_keys: text
  drop_last: true

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/ldlm-1.7b-50
  data_parallel_mode: ddp
  ulysses_parallel_size: 1
  global_batch_size: 4
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: false
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 50
  optimizer: adamw
  lr: 3.0e-4
  lr_warmup_ratio: 0.01
  lr_decay_style: constant
  lr_decay_ratio: 1.0
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_train_epochs: 10
  enable_mixed_precision: true
  enable_gradient_checkpointing: false
  enable_full_shard: false
  enable_fsdp_offload: false
  enable_activation_offload: false
  init_device: cuda
  enable_full_determinism: false
  empty_cache_steps: 100
  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 25000
  save_epochs: 0
  save_hf_weights: true
  save_optimizer_state: false
  auto_resume: false
  save_time_interval_minutes: 0
  use_wandb: true
  wandb_project: open-dllm-compare
  wandb_name: 1.7b-50x-ldlm
