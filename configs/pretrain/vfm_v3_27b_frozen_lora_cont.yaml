# VFM v3 — frozen LoRA continuation (step 500 → 2000)
#
# Resumes z_proj + mask_embed from adapter_step_500.
# Vocab restriction now works (vocab_bias lazy build fixed).
#
# Launch:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/python tasks/train_vfm_v2.py \
#       configs/pretrain/vfm_v3_27b_frozen_lora_cont.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: false
  lora_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v2_27b_dual_refine/checkpoints/lora_step_12000
  freeze_lora: true
  adapter_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v3_27b_frozen_lora/checkpoints/adapter_step_500.pt
  dual_gpu: true
  gpu1_mem: "13GiB"
  gpu0_mem: "16GiB"

vfm:
  version: 3
  z_layer: 32
  refinement_training: false
  ar_shift: true
  z_norm_lambda: 0.0

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v3_27b_frozen_lora
  lr: 5e-4
  warmup_steps: 5                # short — adapter already warm
  weight_decay: 0.01
  max_steps: 2000
  micro_batch_size: 1
  global_batch_size: 1
  use_8bit_adam: true
  log_every: 10
  save_every: 500
  recon_every: 250
  recon_num_probes: 2
  recon_steps: 8
  recon_threshold: 0.7
  recon_early_exit_steps: 2
  recon_prior_rounds: 0
  recon_vocab_restrict: true
  recon_vocab_min_freq: 5
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v3-27b-frozen-lora-cont
