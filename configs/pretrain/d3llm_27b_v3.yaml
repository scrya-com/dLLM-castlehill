# d3LLM 27B v3 — convergence accelerators on top of v2 (scheduled-decode trajectories).
#
# v2 → v3 deltas (each independently ablatable):
#   1. LoRA r=4 → r=16 (with DoRA + rank-stabilized scaling)
#   2. embed_tokens + lm_head now LoRA-adapted → <M> embedding actually learns
#   3. AdamW → PagedAdamW8bit (frees ~25% optimizer state memory)
#   4. Min-SNR loss weighting (γ=5) — variance reduction on the MDM CE
#   5. wandb name suffix -v3 so the two runs are obvious in the runs list
#
# Trajectories: reuses v2's regenerated scheduled-decode trajectories.jsonl
# Data: same data.jsonl (prompt/response pairs)

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  enable_qlorafy: true
  qlorafy_config:
    use_hf_native: true
    r: 16                        # 4 → 16 (4× capacity, ~16M trainable params, tiny memory cost)
    lora_alpha: 32
    lora_dropout: 0.05
    use_dora: true               # Weight-Decomposed LoRA (Liu et al. ICML 2024)
    use_rslora: true             # Rank-stabilized scaling — better stability at higher rank
    target_modules:
      - in_proj_qkv
      - in_proj_a
      - in_proj_b
      - in_proj_z
      - out_proj
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      - embed_tokens             # <M> embedding can now adapt via LoRA
      - lm_head                  # lm_head row for <M> can now adapt via LoRA

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_seq_len: 1024
  train_size: 500
  eval_size: 0
  data_type: plaintext
  text_keys: text
  drop_last: true
  num_workers: 2
  prefetch_factor: 2

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/d3llm_27b_v3
  save_hf_weights: false
  save_epochs: 0
  save_steps: 500
  save_total_limit: 2
  auto_resume: false
  num_train_epochs: 10
  max_steps: 2500
  micro_batch_size: 1
  global_batch_size: 1
  lr: 2e-4
  weight_decay: 0.01
  optimizer: adamw               # adamw_8bit (bnb) hit cudaErrorIllegalAddress on Blackwell SM 12.0; not worth chasing for ~few-hundred-MB win on 16M LoRA params
  rmpad: false
  seed: 42
  data_parallel_mode: ddp
  ckpt_manager: dcp

  enable_masking: true
  repr_align_wt: 0.0

  trajectory_data_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/trajectories.jsonl
  trajectory_min_mask_ratio: 0.05
  trajectory_max_mask_ratio: 0.95
  trajectory_entropy_weight: 0.0
  trajectory_temperature: 1.0

  min_snr_gamma: 5.0             # Min-SNR loss weighting (Hang et al. ICCV 2023)

  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  empty_cache_steps: 1
  init_device: cuda

  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: d3llm-27b-reasoning-500-v3
