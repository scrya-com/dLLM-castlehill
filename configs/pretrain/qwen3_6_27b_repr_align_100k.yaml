# 27B Repr-Align on RTX 5090 — DeepSpeed ZeRO-3 + NVMe offload
# Uses CachedTeacher at /home/johndpope/ds_offload/anchors/qwen3.6-27b/
# covering 100K FineWeb examples on the 12TB drive.
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0 DS_SKIP_CUDA_CHECK=1 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/torchrun --nproc_per_node=1 \
#       tasks/train_torch.py configs/pretrain/qwen3_6_27b_repr_align_100k.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa

data:
  train_path: /run/media/johndpope/12TB/open_dllm/ldlm_data/data.jsonl
  train_size: 100000
  dataloader_type: native
  data_type: plaintext
  max_seq_len: 512
  text_keys: text
  drop_last: true
  datasets_type: mapping
  num_workers: 2
  prefetch_factor: 2

train:
  output_dir: /run/media/johndpope/12TB/open_dllm/checkpoints/qwen3.6-27b-repr-align-100k
  data_parallel_mode: deepspeed
  ds_zero_stage: 3
  init_device: meta
  ds_offload_optimizer: nvme
  ds_offload_param: cpu
  ds_nvme_path: /run/media/johndpope/12TB/open_dllm/ds_offload
  ds_overlap_comm: true
  ds_contiguous_gradients: true

  ulysses_parallel_size: 1
  expert_parallel_size: 1
  global_batch_size: 1
  micro_batch_size: 1
  rmpad: false
  rmpad_with_pos_ids: false
  bsz_warmup_ratio: 0.0
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 50

  # Repr-Align core — 4 evenly-spaced layers
  enable_masking: true
  repr_align_wt: 1.0
  repr_align_sub_sample_ratio: 0.25
  anchor_cache_dir: /home/johndpope/ds_offload/anchors/qwen3.6-27b
  align_layers: "16,32,48,64"

  freeze_layers: ""
  quantize_frozen: false

  # Real training — 100K examples, repeated for 100 steps = ~10 epochs
  max_steps: 200

  optimizer: adamw
  lr: 1.0e-4
  lr_warmup_ratio: 0.01
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  lr_min: 1.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0

  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: false
  enable_fsdp_offload: false
  enable_activation_offload: false
  enable_full_determinism: false
  empty_cache_steps: 50

  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_steps: 500
  save_total_limit: 2
  save_hf_weights: false
  save_epochs: 0
  auto_resume: true
  save_time_interval_minutes: 0

  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: repr-align-27b-100k-1gpu
