# d3LLM 27B QLoRA — 100 samples with 27B-native trajectories
# Uses trajectories generated by Qwen3.6-27B itself for proper d3LLM parity

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  enable_qlorafy: true
  qlorafy_config:
    use_hf_native: true
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - in_proj_qkv
      - in_proj_a
      - in_proj_b
      - in_proj_z
      - out_proj
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

data:
  train_path: /run/media/johndpope/12TB/open_dllm/ldlm_data/data_smoke_1000.jsonl
  max_seq_len: 512
  train_size: 100
  data_type: plaintext
  text_keys: text
  drop_last: true
  num_workers: 4

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/d3llm_27b_100_traj
  save_hf_weights: false
  save_epochs: 0
  save_steps: 100
  auto_resume: false
  num_train_epochs: 10
  max_steps: 1000
  micro_batch_size: 1
  global_batch_size: 1
  lr: 2e-4
  weight_decay: 0.01
  optimizer: adamw
  rmpad: false
  seed: 42
  data_parallel_mode: ddp
  ckpt_manager: dcp

  enable_masking: true
  repr_align_wt: 0.0

  # d3LLM trajectory-guided masking with 27B-native trajectories
  trajectory_data_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-100/trajectories.jsonl
  trajectory_min_mask_ratio: 0.1
  trajectory_max_mask_ratio: 0.5
  trajectory_progressive_block_sizes: "1,2,4"
  trajectory_entropy_weight: 0.1
  trajectory_temperature: 1.0

  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  init_device: cuda
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: d3llm-27b-100-traj
