# VFM v3 — z_sim_loss rollback
#
# Problem: frozen LoRA + CE-only loss = z_proj can't learn (flat loss after 750 steps).
# Root cause: frozen LLM can't adapt to z_proj's outputs; CE gradient too indirect.
#
# Fix:
#   1. Unfreeze LoRA — LLM co-evolves with z_proj (they adapt to each other)
#   2. refinement_training: false — eliminates commit_ratio instability (was root cause
#      of LoRA drift in vfm_v2_27b_dual_refine; not "LoRA" itself)
#   3. z_sim_lambda: 1.0 — direct z supervision: cosine(z, embed(true_token))
#      Tells z_proj exactly where to point. CE loss still present for LLM.
#
# Training objective:
#   loss = 0.5*loss_data + 0.5*loss_obs + z_sim_lambda * (1 - cosine(z, embed(true)))
#
# Launch:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/python tasks/train_vfm_v2.py \
#       configs/pretrain/vfm_v3_27b_zsim.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: false
  lora_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v2_27b_dual_refine/checkpoints/lora_step_12000
  freeze_lora: false              # unfrozen — LLM adapts alongside z_proj
  dual_gpu: true
  gpu1_mem: "13GiB"
  gpu0_mem: "16GiB"

vfm:
  version: 3
  z_layer: 32
  refinement_training: false      # all positions see z — no commit_ratio instability
  ar_shift: true
  z_norm_lambda: 0.0
  z_sim_lambda: 0.2               # direct z supervision weight — gentle (≈6% of total loss)

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v3_27b_zsim
  lr: 5e-4
  warmup_steps: 20
  weight_decay: 0.01
  max_steps: 1000
  micro_batch_size: 1
  global_batch_size: 1
  use_8bit_adam: true
  log_every: 10
  save_every: 500
  recon_every: 100
  recon_num_probes: 2
  recon_steps: 8
  recon_threshold: 0.7
  recon_early_exit_steps: 2
  recon_prior_rounds: 0
  recon_vocab_restrict: true
  recon_vocab_min_freq: 5
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v3-27b-zsim
