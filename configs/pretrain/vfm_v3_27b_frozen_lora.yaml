# VFM v3 — frozen LoRA, only z_proj + mask_embed train
#
# Hypothesis: LoRA drift under commit_ratio curriculum is corrupting Pass 1
# hidden states and causing Voronoi cell regression in DIFF quality.
# Fix: freeze the VFMv2 LoRA (good bidirectional capability), only train z_proj.
#
# Training objective (no refinement_training):
#   Pass 1 (no_grad): h = frozen_LLM(prompt | mask_embed)
#   z = sphere_norm(z_proj(h))          ← only these 26M params train
#   Pass 2: loss = CE(frozen_LLM(prompt | z), completion_ids)
#
# Clean end-to-end signal: move z so frozen bidirectional LLM predicts correctly.
# No LoRA drift. No commit_ratio variance.
#
# Launch:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/python tasks/train_vfm_v2.py \
#       configs/pretrain/vfm_v3_27b_frozen_lora.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: false
  lora_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v2_27b_dual_refine/checkpoints/lora_step_12000
  freeze_lora: true              # freeze LoRA — only z_proj + mask_embed train
  dual_gpu: true
  gpu1_mem: "13GiB"
  gpu0_mem: "16GiB"

vfm:
  version: 3
  z_layer: 32
  refinement_training: false     # all positions see z at Pass 2 — matches inference exactly
  ar_shift: true
  z_norm_lambda: 0.0

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v3_27b_frozen_lora
  lr: 5e-4                       # higher LR OK — only 26M params, no cold-start risk
  warmup_steps: 20               # short warmup for z_proj (fresh init)
  weight_decay: 0.01
  max_steps: 500
  micro_batch_size: 1
  global_batch_size: 1
  use_8bit_adam: true
  log_every: 10
  save_every: 250
  recon_every: 100
  recon_num_probes: 2
  recon_steps: 8
  recon_threshold: 0.7
  recon_early_exit_steps: 2
  recon_prior_rounds: 0
  recon_vocab_restrict: true     # argmax over active training vocab only (~18k vs 248k)
  recon_vocab_min_freq: 5        # exclude tokens seen <5× — z_proj can't generalise to hapax legomena
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v3-27b-frozen-lora
