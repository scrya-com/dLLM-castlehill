# d3LLM 27B QLoRA smoke test — 10 steps with trajectory-guided masking
# Uses 1.7B trajectories on same FineWeb data (pipeline test, not quality test)

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  enable_qlorafy: true
  qlorafy_config:
    use_hf_native: true
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05

data:
  train_path: /home/johndpope/ds_offload/data_50_fineweb.jsonl
  max_seq_len: 512
  train_size: 50
  data_type: plaintext
  text_keys: text

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/d3llm_27b_hf
  save_hf_weights: true
  save_epochs: 0
  save_steps: 10
  auto_resume: false
  num_train_epochs: 1
  max_steps: 10
  micro_batch_size: 1
  global_batch_size: 1
  lr: 2e-4
  weight_decay: 0.01
  optimizer: adamw
  rmpad: false
  seed: 42
  data_parallel_mode: ddp
  ckpt_manager: dcp

  # Repr-Align disabled for pipeline smoke test (no anchor cache for 50-sample subset)
  enable_masking: true
  repr_align_wt: 0.0
  # align_layers: "16,32,48,64"
  # anchor_cache_dir: /home/johndpope/ds_offload/anchors/qwen3.6-27b
  # repr_align_sub_sample_ratio: 0.25

  # d3LLM trajectory-guided masking
  trajectory_data_path: /home/johndpope/ds_offload/trajectories/qwen3-1.7b-fineweb-50/trajectories.jsonl
  trajectory_min_mask_ratio: 0.1
  trajectory_max_mask_ratio: 0.5
  trajectory_progressive_block_sizes: "1,2,4"
  trajectory_entropy_weight: 0.1
  trajectory_temperature: 1.0
