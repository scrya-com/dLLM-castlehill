# VFM v2 smoke run — Qwen3.6-27B + frozen LLM + trainable adapter.
#
# Validates that the variational adapter q_φ can learn to map prompt → noise
# such that one LLM forward produces the response. Frozen-LLM mode (no LoRA,
# no adapter on the LLM itself) — only the small VFMv2NoiseAdapter is
# trainable. ~260M params; ~3 GB optimizer state at fp32 + adapter weights.
#
# Launch on MSI (5090, CUDA_VISIBLE_DEVICES=0 → 5090 per PCI order):
#   cd ~/Documents/GitHub/Open-dLLM
#   CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=1 \
#       PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/python tasks/train_vfm_v2.py \
#       configs/pretrain/vfm_v2_27b_smoke.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: true   # smoke: only the adapter is trainable

vfm:
  # 2 layers + intermediate=hidden*2 keeps the adapter ~300M params at
  # hidden=5120 (Qwen3.6). 4 layers + 4x intermediate blew past 1.4B
  # → AdamW state alone would OOM the 5090.
  adapter_layers: 2
  adapter_heads: 8
  adapter_dropout: 0.1
  adapter_intermediate_size: 10240   # 2x hidden instead of 4x
  max_completion_len: 512
  tau: 1.0
  sigma: 1.0
  kl_weight_final: 0.001          # 10x looser than initial 0.01 to give encoder room
  kl_weight_warmup_steps: 200
  ar_shift: true

data:
  # Smoke run: short sequences so the 27B activations fit on 32GB 5090.
  # NF4 base 13.5GB + adapter ~1.4GB + AdamW state ~5GB + activations.
  # At seq_len 384 we have ~12GB headroom for activations. Production
  # would use gradient checkpointing on the LLM (frozen but still in the
  # graph for adapter gradient flow) to push seq_len higher.
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 128
  max_completion_len: 256

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v2_27b_smoke
  lr: 1e-4
  weight_decay: 0.01
  max_steps: 2000
  micro_batch_size: 1
  global_batch_size: 1
  grad_accum_steps: 1
  log_every: 10
  save_every: 500
  eval_every: 0
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v2-27b-smoke-frozen-llm
