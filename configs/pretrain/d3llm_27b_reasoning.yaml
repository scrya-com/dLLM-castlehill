# d3LLM 27B QLoRA — 500 reasoning examples from Qwen3.6-Plus
# Trajectories generated by Qwen3.6-27B (entropy-mode)
# Uses HF-native QLoRA for Gated DeltaNet compatibility

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  enable_qlorafy: true
  qlorafy_config:
    use_hf_native: true
    r: 4
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - in_proj_qkv
      - in_proj_a
      - in_proj_b
      - in_proj_z
      - out_proj
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

data:
  # Use the original prompt/response JSONL so the training tokenization matches
  # the trajectory generator exactly (separate encode of prompt and response).
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_seq_len: 1024              # half of trajectory max_seq_len (collator slices)
  train_size: 500
  eval_size: 0
  data_type: plaintext           # gated to prompt/response transform by trajectory_data_path
  text_keys: text                # unused for the prompt/response path
  drop_last: true
  num_workers: 2
  prefetch_factor: 2

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/d3llm_27b_reasoning
  save_hf_weights: false
  save_epochs: 0
  save_steps: 500
  save_total_limit: 2
  auto_resume: false
  num_train_epochs: 10
  max_steps: 2500              # 5 epochs over 500 samples — meaningful curriculum sweep
  micro_batch_size: 1
  global_batch_size: 1
  lr: 2e-4
  weight_decay: 0.01
  optimizer: adamw
  rmpad: false
  seed: 42
  data_parallel_mode: ddp
  ckpt_manager: dcp

  enable_masking: true
  repr_align_wt: 0.0

  # d3LLM trajectory-guided masking with reasoning dataset trajectories.
  # Curriculum covers the full range: at mask_ratio=0.95 the student sees
  # step 1 of the trajectory (almost everything still masked, hardest case);
  # at 0.05 it sees the near-final step (just a few hard tokens left).
  trajectory_data_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/trajectories.jsonl
  trajectory_min_mask_ratio: 0.05
  trajectory_max_mask_ratio: 0.95
  trajectory_entropy_weight: 0.0     # off for the rerun; re-enable after baseline ablation
  trajectory_temperature: 1.0

  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  empty_cache_steps: 1
  init_device: cuda

  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: d3llm-27b-reasoning-500
