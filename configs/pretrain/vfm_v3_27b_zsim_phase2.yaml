# VFM v3 z_sim Phase 2 — LoRA adaptation (run after phase1)
#
# Goal: adapt LoRA to decode from z ≈ embed(true_token).
# z_proj is warm-started from phase1 (zsim ~0.1). LoRA is unfrozen.
# VFMv2 LoRA was trained with commit_ratio=1 (saw true embeddings), so
# adapting to z ≈ embed(true_token) should be fast.
# z_sim_lambda=0.1 gently maintains z direction while CE drives LLM adaptation.
#
# Requires phase1 to complete first and save adapter_step_200.pt.
#
# Launch:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/python tasks/train_vfm_v2.py \
#       configs/pretrain/vfm_v3_27b_zsim_phase2.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: false
  lora_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v3_27b_zsim_phase1/checkpoints/lora_step_500
  freeze_lora: false              # unfrozen — LLM adapts to z ≈ true embeddings
  adapter_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v3_27b_zsim_phase1/checkpoints/adapter_step_500.pt
  dual_gpu: true
  gpu1_mem: "13GiB"
  gpu0_mem: "16GiB"

vfm:
  version: 3
  z_layer: 32
  refinement_training: false
  ar_shift: true
  z_norm_lambda: 0.0
  z_sim_lambda: 0.5               # keep pushing z_proj while LLM adapts

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v3_27b_zsim_phase2
  lr: 1e-4                        # lower LR — LoRA already warm, don't overshoot
  warmup_steps: 10
  weight_decay: 0.01
  max_steps: 1000
  micro_batch_size: 1
  global_batch_size: 1
  use_8bit_adam: true
  log_every: 10
  save_every: 500
  recon_every: 100
  recon_num_probes: 2
  recon_steps: 8
  recon_threshold: 0.7
  recon_early_exit_steps: 2
  recon_prior_rounds: 0
  recon_vocab_restrict: true
  recon_vocab_min_freq: 5
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v3-27b-zsim-phase2
