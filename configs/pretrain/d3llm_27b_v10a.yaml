# d3LLM 27B v10a — v10 + 64-step inference sampling
#
# v10 generates samples with 16 diffusion steps (256 tokens → ~16 unmaskings
# per step). The anti_rep_wt loss penalizes p_i(v)·p_j(v) at adjacent masked
# positions, but with 16 parallel unmasks per step, *every* visible repetition
# arises from joint marginals that anti_rep is trying to drive apart.
# Running inference with more steps reduces the parallel unmask width per
# step and gives the anti_rep penalty more room to actually matter at decode.
#
# v10a: same training as v10 (warm-start from v6 step_5000, anti_rep_wt=1.0,
# subgoal_align_wt=1.0, repr_align flat). Only inference knob changes:
# gen_sample_steps 16 → 64. Distinct output_dir + wandb_name so v10 and v10a
# can be A/B'd without checkpoint collision.

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  enable_qlorafy: true
  qlorafy_config:
    use_hf_native: true
    r: 8
    lora_alpha: 32
    lora_dropout: 0.05
    use_dora: false
    use_rslora: true
    resume_adapter_path: /home/johndpope/ds_offload/checkpoints/d3llm_27b_v6/checkpoints/global_step_5000
    target_modules:
      - in_proj_qkv
      - in_proj_a
      - in_proj_b
      - in_proj_z
      - out_proj
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_seq_len: 1024
  train_size: 500
  eval_size: 0
  data_type: plaintext
  text_keys: text
  drop_last: true
  num_workers: 2
  prefetch_factor: 2

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/d3llm_27b_v10a
  save_hf_weights: false
  save_epochs: 0
  save_steps: 500
  save_total_limit: 2
  auto_resume: false
  num_train_epochs: 40
  max_steps: 20000
  micro_batch_size: 1
  global_batch_size: 1
  lr: 2e-4
  weight_decay: 0.01
  optimizer: adamw
  rmpad: false
  seed: 42
  data_parallel_mode: ddp
  ckpt_manager: dcp

  enable_masking: true

  trajectory_data_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/trajectories.jsonl
  trajectory_min_mask_ratio: 0.05
  trajectory_max_mask_ratio: 0.95
  trajectory_entropy_weight: 0.0
  trajectory_temperature: 1.0

  repr_align_wt: 0.5
  repr_align_wt_final: 0.5
  anchor_cache_dir: /run/media/johndpope/12TB/open_dllm/anchors/qwen3.6-27b-reasoning-500-16L
  align_layers: "4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64"
  repr_align_sub_sample_ratio: 0.25
  repr_align_num_sample_layers: 4
  repr_align_layer_exp: 0.0
  repr_align_loss_mode: "angular"
  repr_align_angular_margin: 0.5

  subgoal_align_wt: 1.0
  subgoal_align_n_blocks: 4

  anti_rep_wt: 1.0

  llrd_decay: 0.85
  min_snr_gamma: 5.0
  gen_sample_every_steps: 500
  gen_sample_steps: 64           # v10a — bump 16 → 64 to thin parallel unmasking

  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  empty_cache_steps: 1
  init_device: cuda

  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: d3llm-27b-reasoning-500-v10a-64step-decode
