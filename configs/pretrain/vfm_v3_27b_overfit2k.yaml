# VFM v3 — 2000-step continuation from overfit1 step-500 checkpoint
#
# Resumes LoRA + z_proj/mask_embed from step 500.
# Adam state not saved, warmup_steps=50 handles cold-start.
#
# Launch:
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       .venv/bin/python tasks/train_vfm_v2.py \
#       configs/pretrain/vfm_v3_27b_overfit2k.yaml

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: false
  lora_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v3_27b_overfit1/checkpoints/lora_step_500
  adapter_resume_path: /home/johndpope/ds_offload/checkpoints/vfm_v3_27b_overfit1/checkpoints/adapter_step_500.pt
  dual_gpu: true
  gpu1_mem: "13GiB"
  gpu0_mem: "16GiB"

vfm:
  version: 3
  z_layer: 32
  refinement_training: true
  ar_shift: true
  z_norm_lambda: 0.00001
  adapter_layers: 2
  adapter_heads: 8
  max_completion_len: 512

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v3_27b_overfit2k
  lr: 2e-4
  warmup_steps: 50
  weight_decay: 0.01
  max_steps: 2000
  micro_batch_size: 1
  global_batch_size: 1
  use_8bit_adam: true
  log_every: 10
  save_every: 500
  recon_every: 200
  recon_num_probes: 2
  recon_steps: 8
  recon_threshold: 0.7
  recon_early_exit_steps: 2
  recon_prior_rounds: 0       # prior_rounds is OOD at inference; disabled until training covers it
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v3-27b-overfit2k
