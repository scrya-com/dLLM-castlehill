# VFM v2 smoke run — Qwen3.6-27B, MSI box dual-GPU model-parallel.
# RTX 5090 (32 GB, cuda:0) + RTX PRO 4000 (24 GB, cuda:1).
#
# Single-process model-parallel — do NOT use torchrun.
# VISIBLE_DEVICES=1,0 maps 5090 (PCI bus 1) → cuda:0 (adapter device)
#                           4000 (PCI bus 0) → cuda:1 (frozen base layers).
#
# gpu1_mem capped at 14 GiB so the lm_head spills to cuda:0 (5090).
# The lm_head forward allocates ~380 MB for logits (1×768×248k vocab);
# packing the whole model on the 4000 OOMs it at that point.
# embedding + ~56 of 64 layers fit in 14 GiB on cuda:1;
# remaining layers + lm_head (~4 GB) land on cuda:0.
#
# Launch:
#   cd ~/Documents/GitHub/Open-dLLM
#   CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=1,0 \
#       PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True \
#       nohup .venv/bin/python train_vfm_v2.py vfm_v2_27b_msi-dual.yaml \
#       > /tmp/vfm_v2_train.log 2>&1 &

model:
  model_path: /home/johndpope/ds_offload/models/Qwen3.6-27B
  attn_implementation: sdpa
  freeze_llm: true
  dual_gpu: true
  gpu1_mem: "14GiB"   # RTX PRO 4000 (24 GB) — embedding + most frozen layers
  gpu0_mem: "16GiB"   # RTX 5090 (32 GB) — last layers + lm_head + adapter

vfm:
  adapter_layers: 2
  adapter_heads: 8
  adapter_dropout: 0.1
  adapter_intermediate_size: 10240   # 2x hidden instead of 4x
  max_completion_len: 512
  tau: 1.0
  sigma: 1.0
  kl_weight_final: 0.01
  kl_weight_warmup_steps: 200
  ar_shift: true

data:
  train_path: /home/johndpope/ds_offload/trajectories/qwen3.6-27b-reasoning-500/data.jsonl
  max_prompt_len: 256
  max_completion_len: 512

train:
  output_dir: /home/johndpope/ds_offload/checkpoints/vfm_v2_27b_smoke
  lr: 1e-4
  weight_decay: 0.01
  max_steps: 2000
  micro_batch_size: 1
  global_batch_size: 1
  grad_accum_steps: 1
  log_every: 10
  save_every: 500
  eval_every: 0
  seed: 42
  use_wandb: true
  wandb_project: open-dllm-27b
  wandb_name: vfm-v2-27b-msi-dual
